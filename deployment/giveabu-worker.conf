; Install with project paths and Unix user adjusted for your server.
[program:giveabu-payments]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/giveabu/current/artisan queue:work --queue=payments --sleep=3 --tries=3 --timeout=120 --max-time=3600 --max-jobs=500 --memory=256
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=180
redirect_stderr=true
stdout_logfile=/var/log/giveabu-payments.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:giveabu-notifications]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/giveabu/current/artisan queue:work --queue=notifications --sleep=3 --tries=3 --timeout=120 --max-time=3600 --max-jobs=500 --memory=256
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=180
redirect_stderr=true
stdout_logfile=/var/log/giveabu-notifications.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
