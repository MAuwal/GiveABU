# Private app-node template: terminate TLS at a trusted ingress.
# Adjust PHP socket, release path, ingress CIDR and upload limits before installation.
server {
    listen 8080;
    server_name giveabu.com www.giveabu.com;
    root /var/www/giveabu/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20m;

    location = /ready {
        allow 10.10.0.0/24; # Replace with exact ingress/monitor network.
        deny all;
        try_files /nonexistent /index.php?$query_string;
    }
    location = /up {
        allow 10.10.0.0/24;
        deny all;
        try_files /nonexistent /index.php?$query_string;
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 65s;
    }
    # Only the front controller may execute PHP, including under uploaded paths.
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
